name: Manual
on:
  workflow_dispatch:
    inputs:
      name:
        description: Your name
        required: true
        default: Arbaz
      greeting:
        description: Greeting
        default: Hello
      data:
        description: Some data
        default: test
jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ inputs.greeting }} ${{ inputs.name }}, data=${{ inputs.data }}"
