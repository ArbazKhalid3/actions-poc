name: Secrets
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Variable is ${{ vars.MY_VAR }}"
      - name: Use secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: echo "Secret is $MY_SECRET"
      - name: Call API with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/${{ github.repository }} --jq .full_name
